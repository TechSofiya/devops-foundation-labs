# READ-ONLY EXERCISE: This is a BLUEPRINT, not a working AWS integration.
# ExternalSecrets CRD/ESO/SecretStore/AWS IAM ARE NOT installed/configured here.
# Do not kubectl apply this file in Killercoda.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portfolio-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: portfolio-credentials
  dataFrom:
    - extract:
        key: /training/REPLACE_ME/portfolio-app  # TODO replace REPLACE_ME with foundation11
