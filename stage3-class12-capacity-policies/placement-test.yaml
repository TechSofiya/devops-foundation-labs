# Placement-rule failure (not a quota failure; no AWS node growth).
apiVersion: v1
kind: Pod
metadata:
  name: placement-test
spec:
  restartPolicy: Never
  nodeSelector:
    training.invalid/fleet: a-node-that-does-not-exist
  containers:
    - name: demo
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 256Mi
