# Autoscaling/v2 manifest can be accepted without Metrics Server.
# That does not mean live CPU measurements/scaling will work.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: capacity-app-cpu
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: capacity-app
  minReplicas: 1
  maxReplicas: 3                 # TODO: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75  # TODO: 60 percent of each Pod's CPU request
