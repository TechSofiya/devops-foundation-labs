# Policy demo: 600m CPU request is legal per container, but exceeds
# the ENTIRE 500m namespace quota. Deployment/ReplicaSet may exist; no Pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quota-blocked
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quota-blocked
  template:
    metadata:
      labels:
        app: quota-blocked
    spec:
      containers:
        - name: demo
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              cpu: 600m
              memory: 64Mi
            limits:
              cpu: 750m
              memory: 128Mi
