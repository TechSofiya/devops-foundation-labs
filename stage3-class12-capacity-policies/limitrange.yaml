apiVersion: v1
kind: LimitRange
metadata:
  name: team-container-rules
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 25m           # TODO: 50m
        memory: 32Mi       # TODO: 64Mi
      default:
        cpu: 200m          # TODO: 250m
        memory: 128Mi      # TODO: 256Mi
      max:
        cpu: "1"          # one CPU, not 1m
        memory: 1Gi
