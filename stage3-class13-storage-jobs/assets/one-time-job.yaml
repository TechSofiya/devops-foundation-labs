# A Job that checks a Service endpoint once. This is NOT a real SQL migration.
# The deliberate missing-Service failure mirrors the diagnosis from the school's Class 13.
apiVersion: batch/v1
kind: Job
metadata:
  name: ledger-setup
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: setup
          image: busybox:1.36
          command:
            - sh
            - -ec
            - |
              echo 'Looking for ledger-db Service...'
              wget -q -T 5 -O /dev/null http://ledger-db:8080
              echo 'ONE_TIME_TASK_OK'
