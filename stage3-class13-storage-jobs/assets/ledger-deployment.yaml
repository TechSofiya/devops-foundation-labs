# A tiny HTTP app stands in for a database to isolate the persistence mechanism.
# This is NOT Postgres and does NOT create a real trades table.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger-app
  template:
    metadata:
      labels:
        app: ledger-app
    spec:
      containers:
        - name: ledger
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /www
              echo 'ledger endpoint is responding' > /www/index.html
              exec httpd -f -p 8080 -h /www
          ports:
            - containerPort: 8080
          # TODO: volumeMounts: mount database-files to /records
      # TODO: volumes: name database-files; persistentVolumeClaim.claimName: ledger-data
