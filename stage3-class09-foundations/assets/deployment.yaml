apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-app
  template:
    metadata:
      labels:
        app: portfolio-app
    spec:
      containers:
        - name: portfolio-app
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              if [ -z "$TICKER" ] || [ -z "$DB_PASSWORD" ]; then
                echo "Required environment variables are missing"
                exit 1
              fi
              mkdir -p /www
              printf 'ticker=%s\n' "$TICKER" > /www/index.html
              exec httpd -f -p 8080 -h /www
          ports:
            - containerPort: 8080
          # TODO: Add envFrom with configMapRef to portfolio-settings
          # TODO: Add env with DB_PASSWORD from portfolio-credentials using secretKeyRef
          # Do not place the password value into this Deployment.
