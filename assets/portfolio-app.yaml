# A tiny sleeping container stands in for a real app. There is no HTTP server/DB.
# Class 9 taught envFrom and secretKeyRef; Class 11 uses this to test rotation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-app
  template:
    metadata:
      labels:
        app: portfolio-app
    spec:
      containers:
        - name: portfolio-app
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 30; done"]
          # TODO in Step 4: bring in all portfolio-settings keys using envFrom.
          # TODO in Step 4: source an env variable named DB_PASSWORD
          # from Secret portfolio-credentials, key DB_PASSWORD.
          # In Step 7 resource requests/limits will be added by a PATCH.
