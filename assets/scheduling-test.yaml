# Intentionally UNSCHEDULABLE test. Do not create costly infrastructure.
# A 1000-core CPU request cannot fit on this single temporary training node.
apiVersion: v1
kind: Pod
metadata:
  name: cannot-fit
  labels:
    app: capacity-test
spec:
  restartPolicy: Never
  containers:
    - name: capacity-test
      image: busybox:1.36
      command: ["sh", "-c", "sleep 300"]
      resources:
        requests:
          cpu: "1000"
          memory: "64Mi"
