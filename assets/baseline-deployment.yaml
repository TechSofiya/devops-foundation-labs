# Temporary standalone practice app. No AWS/ECR/database.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capacity-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: capacity-app
  template:
    metadata:
      labels:
        app: capacity-app
    spec:
      containers:
        - name: capacity-app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          # Stage 2: intentionally has no resources: block.
          # Stage 3: patch the live Deployment, not this file.
